<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Joel Mills</title>
  <link rel="icon" href="assets/img/lightning-charge.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <canvas id="game-canvas"></canvas>
  <div id="labels"></div>

  <!-- Car Selection Screen -->
  <div id="car-select">
    <div class="car-select-inner">
      <h1>JOEL MILLS</h1>
      <p class="subtitle">Software Engineer &nbsp;·&nbsp; Startup Founder</p>
      <div class="divider"></div>
      <p class="pick-label">PICK YOUR RIDE</p>
      <div class="shape-options">
        <div class="shape-option selected" data-shape="car"><div class="shape-icon shape-icon-car"></div><span>CAR</span></div>
        <div class="shape-option" data-shape="truck"><div class="shape-icon shape-icon-truck"></div><span>TRUCK</span></div>
        <div class="shape-option" data-shape="moto"><div class="shape-icon shape-icon-moto"></div><span>MOTO</span></div>
      </div>
      <p class="pick-label" style="margin-top:0.5rem">PICK YOUR COLOUR</p>
      <div class="car-options">
        <div class="car-option" data-color="0xFF6B6B" style="--c:#FF6B6B"></div>
        <div class="car-option" data-color="0x4ECDC4" style="--c:#4ECDC4"></div>
        <div class="car-option selected" data-color="0x6C63FF" style="--c:#6C63FF"></div>
        <div class="car-option" data-color="0xFF9F43" style="--c:#FF9F43"></div>
        <div class="car-option" data-color="0xFF8B94" style="--c:#FF8B94"></div>
      </div>
      <button id="start-btn">START DRIVING</button>
      <p class="hint">WASD / Arrow Keys &nbsp;·&nbsp; SPACE = boost &nbsp;·&nbsp; ENTER = explore</p>
    </div>
  </div>

  <!-- Touch controls (mobile) -->
  <div id="touch-controls">
    <div id="dpad">
      <button class="dpad-btn dpad-up">▲</button>
      <div class="dpad-mid">
        <button class="dpad-btn dpad-left">◄</button>
        <div class="dpad-center"></div>
        <button class="dpad-btn dpad-right">►</button>
      </div>
      <button class="dpad-btn dpad-down">▼</button>
    </div>
    <button id="boost-btn">BOOST</button>
  </div>

  <!-- HUD -->
  <div id="hud">
    <div id="controls-hint">WASD / ↑↓←→ &nbsp;·&nbsp; SPACE = boost &nbsp;·&nbsp; ENTER = enter building</div>
    <button id="menu-btn">MENU</button>
  </div>

  <!-- Entry Prompt -->
  <div id="entry-prompt"></div>

  <!-- Section Overlay -->
  <div id="section-overlay">
    <div class="overlay-topbar">
      <button id="close-overlay"><span class="esc-badge">ESC</span> ← Back to driving</button>
    </div>
    <div id="overlay-content"></div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js"
    }
  }
  </script>
  <script type="module" src="assets/js/game.js"></script>
</body>
</html>
